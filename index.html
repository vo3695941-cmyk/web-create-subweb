<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trình Biến Code Thành Link Siêu Nén</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 15px; background: #f5f7fb; color: #333; }
        .container { max-width: 750px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; font-size: 22px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #34495e; font-size: 14px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        textarea { width: 100%; height: 130px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; font-size: 13px; background: #fafafa; resize: vertical; margin-bottom: 5px; }
        textarea:focus, input[type="text"]:focus { border-color: #2ecc71; background: #fff; outline: none; }
        button { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; -webkit-appearance: none; }
        button:active { background: #27ae60; }
        #result-box { margin-top: 20px; padding: 15px; background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 4px; display: none; }
        .link-output { width: 100%; padding: 12px; background: #fff; border: 1px solid #ddd; margin: 8px 0; font-family: monospace; font-size: 13px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-test { background: #3498db; text-align: center; text-decoration: none; color: white; padding: 12px; border-radius: 4px; flex: 1; font-weight: bold; font-size: 15px; }
        #preview-zone { margin-top: 25px; display: none; border: 2px dashed #e67e22; padding: 15px; background: #fff; border-radius: 4px; }
        #preview-iframe { width: 100%; height: 400px; border: 1px solid #ddd; background: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ Trình Biến Code Thành Link Siêu Nén</h1>
        <div class="subtitle">Đan HTML, CSS, JS và Python vào một liên kết duy nhất</div>
        
        <div class="form-group">
            <label for="web-name">📌 Tiêu đề trang web:</label>
            <input type="text" id="web-name" placeholder="Ví dụ: Dự án đa ngôn ngữ...">
        </div>
        
        <div class="form-group">
            <label for="web-html">💻 Giao diện (HTML):</label>
            <textarea id="web-html" placeholder="<h1>Ứng dụng Python</h1><div id='python-output'>Đang chờ chạy Python...</div>"></textarea>
        </div>

        <div class="form-group">
            <label for="web-css">🎨 Thiết kế (CSS):</label>
            <textarea id="web-css" placeholder="#python-output { padding: 10px; background: #eee; }"></textarea>
        </div>

        <div class="form-group">
            <label for="web-js">⚡ Hành động (JavaScript):</label>
            <textarea id="web-js" placeholder=""></textarea>
        </div>

        <div class="form-group">
            <label for="web-py">🐍 python(alpha):</label>
            <textarea id="web-py" placeholder="print('hello world')"></textarea>
        </div>

        <button type="button" id="btn-export">🚀 Xuất Bản Web & Lấy Link Rút Gọn</button>
        
        <div id="result-box">
            <p style="color: #1e8449; font-weight: bold; margin-top: 0;">🎉 Đã tạo liên kết thành công!</p>
            <label>Link của bạn:</label>
            <input type="text" id="short-link" class="link-output" readonly>
            <div class="btn-group">
                <a href="#" id="link-run" target="_blank" class="btn-test">🌍 Chạy thử</a>
                <button type="button" id="btn-preview-local" style="flex: 1; background: #e67e22; border:none; color:white; font-weight:bold; border-radius:4px;">👁️ Xem nhanh</button>
            </div>
        </div>
        <div id="preview-zone">
            <h3 style="margin-top: 0; color: #e67e22;">👀 Khung xem trước trực tiếp:</h3>
            <iframe id="preview-iframe"></iframe>
        </div>
    </div>

    <!-- KHẮC PHỤC TRIỆT ĐỂ: Luôn đặt script ở cuối cùng, sát nút thẻ đóng body -->
    <script src="script.js"></script>
</body>
</html>
