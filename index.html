<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>eopo - Trình Tạo Web Siêu Nén</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 15px; background: #f5f7fb; color: #333; }
        .container { max-width: 750px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 0 auto; position: relative; }
        .header-box { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        h1 { margin: 0; color: #2c3e50; font-size: 28px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
        .btn-docs { padding: 6px 14px; background: #34495e; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #34495e; font-size: 14px; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; font-size: 13px; background: #fafafa; resize: vertical; margin-bottom: 5px; }
        textarea:focus, input[type="text"]:focus { border-color: #2ecc71; background: #fff; outline: none; }
        input[type="text"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .toggle-container { display: flex; align-items: center; justify-content: space-between; background: #ebf5fb; padding: 12px; border-radius: 4px; border: 1px solid #aed6f1; margin-bottom: 15px; }
        .toggle-label { font-weight: bold; color: #2980b9; font-size: 14px; }
        button.btn-main { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; -webkit-appearance: none; }
        button.btn-main:active { background: #27ae60; }
        
        #result-box { margin-top: 20px; padding: 15px; background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 4px; display: none; }
        .copy-row { display: flex; gap: 8px; margin: 8px 0; }
        .link-output { flex: 1; padding: 12px; background: #fff; border: 1px solid #ddd; font-family: monospace; font-size: 13px; border-radius: 4px; }
        .btn-copy { padding: 0 16px; background: #2c3e50; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; white-space: nowrap; }
        .btn-copy:active { background: #1a252f; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-test { background: #3498db; text-align: center; text-decoration: none; color: white; padding: 12px; border-radius: 4px; flex: 1; font-weight: bold; font-size: 15px; }
        #preview-zone { margin-top: 25px; display: none; border: 2px dashed #e67e22; padding: 15px; background: #fff; border-radius: 4px; }
        #preview-iframe { width: 100%; height: 400px; border: 1px solid #ddd; background: #fff; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 15px; box-sizing: border-box; }
        .modal-box { background: white; padding: 20px; border-radius: 6px; max-width: 550px; width: 100%; max-height: 80vh; overflow-y: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.2); text-align: left; }
        .modal-box h2 { margin-top: 0; color: #2c3e50; font-size: 20px; border-bottom: 2px solid #eee; padding-bottom: 8px; }
        .btn-close-docs { margin-top: 15px; padding: 10px 20px; background: #e74c3c; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; float: right; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-box">
            <h1>eopo</h1>
            <button type="button" id="btn-open-docs" class="btn-docs">docs</button>
        </div>
        <div class="subtitle">Môi trường thực thi đa ngôn ngữ phiên bản siêu nén</div>
        
        <div class="form-group">
            <label for="web-name">📌 Tiêu đề trang web:</label>
            <input type="text" id="web-name" placeholder="Ví dụ: Ứng dụng của tôi...">
        </div>
        
        <div class="form-group">
            <label for="web-html">💻 Giao diện (HTML):</label>
            <textarea id="web-html" placeholder="<h1>Thử nghiệm thực thi</h1>"></textarea>
        </div>

        <div class="form-group">
            <label for="web-css">🎨 Thiết kế (CSS):</label>
            <textarea id="web-css" placeholder=""></textarea>
        </div>

        <div class="form-group">
            <label for="web-js">⚡ Hành động (JavaScript):</label>
            <textarea id="web-js" placeholder=""></textarea>
        </div>

        <div class="form-group">
            <label for="web-py">🐍 python(alpha):</label>
            <textarea id="web-py" placeholder="print('Xin chào bro!')"></textarea>
        </div>

        <div class="toggle-container">
            <span class="toggle-label">🖥️ Chế độ thực thi mã Python:</span>
            <select id="console-toggle" style="width: auto; padding: 6px 12px;">
                <option value="on">Bật Console (Hộp đen Terminal)</option>
                <option value="off">Tắt Console (In thẳng ra màn hình)</option>
            </select>
        </div>

        <button type="button" id="btn-export" class="btn-main">🚀 Xuất Bản Web & Lấy Link Siêu Ngắn</button>
        
        <div id="result-box">
            <p style="color: #1e8449; font-weight: bold; margin-top: 0;">🎉 Đã nén và tạo link thành công!</p>
            <label>Link rút gọn của bạn:</label>
            <div class="copy-row">
                <input type="text" id="short-link" class="link-output" readonly>
                <button type="button" id="btn-copy" class="btn-copy">📋 Copy</button>
            </div>
            <div class="btn-group">
                <a href="#" id="link-run" target="_blank" class="btn-test">🌍 Chạy thử</a>
                <button type="button" id="btn-preview-local" style="flex: 1; background: #e67e22; border:none; color:white; font-weight:bold; border-radius:4px;">👁️ Xem nhanh</button>
            </div>
        </div>
        <div id="preview-zone">
            <h3 style="margin-top: 0; color: #e67e22;">👀 Khung xem trước trực tiếp:</h3>
            <iframe id="preview-iframe"></iframe>
        </div>
    </div>

    <div id="docs-modal" class="modal-overlay">
        <div class="modal-box">
            <h2>Kiến thức & Tài liệu hướng dẫn</h2>
            <div class="modal-content">
                <h1></h1>
            </div>
            <button type="button" id="btn-close-docs" class="btn-close-docs">Đóng</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
