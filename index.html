<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Tạo Web Từ Mã HTML Cá Nhân</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background: #f5f7fb; color: #333; }
        .container { max-width: 750px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: bold; margin-bottom: 6px; color: #34495e; }
        input[type="text"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        /* Style cho ô dán mã HTML */
        textarea { width: 100%; height: 200px; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: 'Courier New', Courier, monospace; font-size: 13px; background: #fafafa; resize: vertical; }
        textarea:focus { border-color: #3498db; background: #fff; outline: none; }
        button { width: 100%; padding: 14px; background: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #27ae60; }
        #result-box { margin-top: 20px; padding: 15px; background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 4px; display: none; }
        .link-output { width: 100%; padding: 10px; background: #fff; border: 1px solid #ddd; margin: 8px 0; font-family: monospace; font-size: 13px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-test { background: #3498db; text-align: center; text-decoration: none; color: white; padding: 11px; border-radius: 4px; flex: 1; font-weight: bold; font-size: 15px; }
        .btn-test:hover { background: #2980b9; }
        /* Khung hiển thị nội dung chạy thử trực tiếp */
        #preview-zone { margin-top: 25px; display: none; border: 2px dashed #e67e22; padding: 15px; background: #fff; border-radius: 4px; }
        #preview-iframe { width: 100%; height: 400px; border: 1px solid #ddd; background: #fff; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ Trình Biến Mã HTML Thành Liên Kết Web</h1>
        <div class="subtitle">Dán code của bạn vào đây, hệ thống tự động sinh link chạy ngay lập tức!</div>
        
        <!-- Nhập tên tiêu đề trang -->
        <div class="form-group">
            <label for="web-name">📌 Nhập tên/tiêu đề trang web:</label>
            <input type="text" id="web-name" placeholder="Ví dụ: Trang web của Nguyễn Văn A...">
        </div>

        <!-- Ô DÁN MÃ HTML MỚI THÊM -->
        <div class="form-group">
            <label for="web-html">💻 Dán toàn bộ mã HTML (bao gồm cả Style/Script nếu có) vào đây:</label>
            <textarea id="web-html" placeholder="<html>&#10;<body>&#10;  <h1>Xin chào thế giới!</h1>&#10;  <script>alert('Web chạy rồi!');</script>&#10;</body>&#10;</html>"></textarea>
        </div>

        <button id="btn-export">🚀 Xuất Bản Web & Lấy Link Rút Gọn</button>

        <!-- Khung hiển thị kết quả -->
        <div id="result-box">
            <p style="color: #1e8449; font-weight: bold; margin-top: 0;">🎉 Đã tạo liên kết thành công!</p>
            <label>Sao chép link này gửi cho bạn bè:</label>
            <input type="text" id="short-link" class="link-output" readonly>
            
            <div class="btn-group">
                <a href="#" id="link-run" target="_blank" class="btn-test">🌍 Chạy thử trên Tab mới</a>
                <button id="btn-preview-local" style="flex: 1; background: #e67e22;">👁️ Xem nhanh bên dưới</button>
            </div>
        </div>

        <!-- Khu vực hiển thị kết quả bằng iframe để tránh xung đột mã với trang chủ -->
        <div id="preview-zone">
            <h3 style="margin-top: 0; color: #e67e22;">👀 Khung xem trước trực tiếp:</h3>
            <iframe id="preview-iframe"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
