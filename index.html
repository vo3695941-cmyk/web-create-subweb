<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Tạo Website Tự Động</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 30px; background: #f5f7fb; color: #333; }
        .container { max-width: 600px; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #27ae60; }
        #result-box { margin-top: 20px; padding: 15px; background: #e8f8f5; border: 1px solid #a3e4d7; border-radius: 4px; display: none; }
        .link-output { width: 100%; padding: 8px; background: #fff; border: 1px solid #ddd; margin: 8px 0; font-family: monospace; font-size: 13px; }
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-test { background: #3498db; text-align: center; text-decoration: none; color: white; padding: 10px; border-radius: 4px; flex: 1; font-weight: bold; }
        .btn-test:hover { background: #2980b9; }
        /* Khung hiển thị nội dung chạy thử trực tiếp (Tránh lag) */
        #preview-zone { margin-top: 25px; display: none; border: 2px dashed #3498db; padding: 15px; background: #fff; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ Trình Tạo Web Cấp Tốc</h1>
        
        <!-- Form nhập thông tin tạo web -->
        <div class="form-group">
            <label for="web-name">Nhập tên trang web của bạn:</label>
            <input type="text" id="web-name" placeholder="Ví dụ: Shop Của Tôi, Blog Thú Cưng...">
        </div>

        <div class="form-group">
            <label for="web-theme">Chọn kiểu giao diện:</label>
            <select id="web-theme">
                <option value="modern">Hiện đại (Xanh dương)</option>
                <option value="vintage">Cổ điển (Cam đất)</option>
                <option value="dark">Chế độ tối (Đen huyền bí)</option>
            </select>
        </div>

        <button id="btn-export">🚀 Bấm Xuất Web & Tạo Link</button>

        <!-- Khung hiển thị kết quả sau khi bấm nút -->
        <div id="result-box">
            <p style="color: #1e8449; font-weight: bold; margin-top: 0;">🎉 Xuất website thành công!</p>
            <label>Link rút gọn mã hóa của bạn:</label>
            <input type="text" id="short-link" class="link-output" readonly>
            
            <div class="btn-group">
                <a href="#" id="link-run" target="_blank" class="btn-test">🌍 Chạy thử (Tab mới)</a>
                <button id="btn-preview-local" style="flex: 1; background: #9b59b6;">👁️ Xem thử phía dưới</button>
            </div>
        </div>

        <!-- Khung xem thử trực tiếp tại trang -->
        <div id="preview-zone">
            <h3 style="margin-top: 0; color: #3498db;">👀 Khu vực xem trước:</h3>
            <div id="preview-content"></div>
        </div>
    </div>

    <!-- Nhúng file script xử lý logic tạo web -->
    <script src="script.js"></script>
</body>
</html>
