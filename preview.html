<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang tải trang web con...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f5f7fb; color: #333; }
        .loading { font-size: 18px; color: #7f8c8d; }
    </style>
</head>
<body>

    <div id="loader" class="loading">⏳ Đang khởi tạo website con...</div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // ĐỒNG BỘ: Đổi sang lấy tham số ?web= trùng khớp hoàn toàn với file script.js mới
            const urlParams = new URLSearchParams(window.location.search);
            const webData = urlParams.get('web');

            if (webData) {
                try {
                    // Tiến hành giải mã an toàn chuỗi Base64 và Unicode tiếng Việt
                    const binString = atob(webData.replace(/-/g, '+').replace(/_/g, '/'));
                    const bytes = Uint8Array.from(binString, (m) => m.charCodeAt(0));
                    const decodedHtml = new TextDecoder().decode(bytes);
                    
                    // Ghi đè toàn bộ nội dung mã nguồn gốc lên giao diện người xem
                    document.open();
                    document.write(decodedHtml);
                    document.close();
                } catch (e) {
                    console.error("Lỗi dựng trang: ", e);
                    document.getElementById("loader").innerHTML = `
                        <h2 style="color:#e74c3c;">❌ Lỗi: Không thể khởi dựng mã HTML!</h2>
                        <p>Đường dẫn có thể đã bị sao chép thiếu ký tự hoặc chứa mã không tương thích.</p>
                    `;
                }
            } else {
                document.getElementById("loader").innerHTML = `
                    <h2 style="color:#e74c3c;">⚠️ Cảnh báo: Không tìm thấy dữ liệu trang web!</h2>
                    <p>Vui lòng sử dụng đường link được tạo ra từ trang chủ.</p>
                `;
            }
        });
    </script>
</body>
</html>
